[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docparse-sdk"
dynamic = ["version"]
description = "Unified Python client SDK for MinerU2.5 and TeleOCR document-parsing VLM services (vLLM / OpenAI-compatible)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
keywords = ["ocr", "document-parsing", "mineru", "teleocr", "vlm", "pdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# Pure client: no torch / vllm. Models are deployed separately (see deploy_ocr_vlm.sh).
dependencies = [
    "httpx>=0.27",
    "pillow>=10.2",
    "pypdfium2>=4.30",
    "pydantic>=2.5",   # used by vendored TeleOCR otsl2html
    "loguru>=0.7",
]

[project.optional-dependencies]
mineru = ["mineru-vl-utils>=2.0.5"]
official = ["docvortex>=0.5.15", "mineru-vl-utils>=2.0.5"]  # MinerU 4.0-aligned post-processing + renderers
all = ["docparse-sdk[mineru,official]"]
dev = ["docparse-sdk[official]", "pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "build", "twine"]

[project.scripts]
docparse = "docparse.cli:main"

[tool.hatch.version]
path = "src/docparse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse"]

[tool.hatch.build.targets.sdist]
include = ["src/docparse", "tests", "README.md", "NOTICE.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: needs live MinerU/TeleOCR services (auto-skipped when unreachable)",
           "slow: long live tests (whole document, stress, corpus); run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
extend-exclude = ["src/docparse/_vendor"]
